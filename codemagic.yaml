# Codemagic: the TestFlight upload ONLY (OPEN_QUESTIONS R266, PROVISIONAL; owner's decision of 20 Nov 2026). Compile
# checks, package tests and UI tests stay on GitHub Actions (.github/workflows/compile-check.yml). The GitHub TestFlight
# workflow (.github/workflows/testflight.yml) was rewritten on 24 Nov 2026 (R463) to do the same with manual signing and the
# same scripts; this file stays until the owner decides (R465; docs/TESTFLIGHT.md).
#
# MANUAL ONLY: there is no `triggering:` section. Codemagic's codemagic.yaml reference (read 20 Nov 2026,
# https://docs.codemagic.io/yaml-basic-configuration/yaml-getting-started/): "If no events are defined, you can start
# builds only manually", by "clicking Start new build in Codemagic". The pre-push check refuses a `triggering:` key.
#
# SECRETS: none in this file and none in the repository. The only name here is the App Store Connect integration
# `asc-testflight`, which the owner adds in Codemagic (docs/TESTFLIGHT.md, Codemagic route). Codemagic: the integration
# "will expose necessary environment variables during the build" for the CLI tools.
#
# SIGNING: ONE certificate, reused. `ios_signing` uses Codemagic's form `distribution_type: app_store` +
# `bundle_identifier: com.liamp.videoplayer`. Codemagic's signing page (read again 20 Nov 2026,
# https://docs.codemagic.io/yaml-code-signing/signing-ios/): "To fetch all uploaded signing files matching a specific
# distribution type and bundle identifier during the build"; "Codemagic will fetch any uploaded certificates and profiles
# matching the extensions as well"; with these two fields "it is not allowed to configure `provisioning_profiles` and
# `certificates` fields". So Codemagic installs the owner's stored Apple Distribution certificate (the one that already
# signs the owner's other two apps) by type and bundle identifier; scripts/cm-testflight.sh signing then checks that exactly one
# App Store Connect certificate matches the keychain's identity, otherwise it stops. The earlier form
# `certificates: - <reference name>` alone was rejected by Codemagic's validator on 20 Nov 2026 ("Either distribution
# profile and bundle identifier or provisioning profiles (and optionally certificates) must be provided"). UNVERIFIED: what
# Codemagic does when no tvOS profile is stored for the bundle identifier (fail or warn), and whether it then still
# installs the certificate; the signing step makes the tvOS profiles after it. This workflow NEVER creates, generates,
# revokes or deletes a certificate or a key (the pre-push check and scripts/test-ci-codemagic.sh refuse the commands
# that would).
#
# LOGS: every command's output goes to a file on the build machine; the log shows only result lines and, on failure, the
# error lines, redacted (scripts/cm-testflight.sh redact, then scripts/ci-testflight-log.sh): no key, certificate,
# profile content, serial number or holder's name. No e-mail, Slack or other publishing.
#
# XCODE: Codemagic's macOS spec page for Xcode 27.2 (read 20 Nov 2026, https://docs.codemagic.io/specs-macos/xcode-27-2.md):
# Xcode 27.2 (27B52) with the tvOS 27.2 SDK on the Mac mini M2. Selected as "27.2" ("Define latest, edge or version (e.g.
# 11.2)"), the same Xcode as the GitHub runner. Never `latest` or `edge`: `edge` is 27.3 (27C5020n) and may be a beta.
#
# MINUTES: max_build_duration 30 (Codemagic: minutes, "min 1, max 120"), so a hang stops at 30 minutes. mac_mini_m2 is the
# machine of the free plan (mac_mini_m4 needs billing). OPEN_QUESTIONS R105: on 20 November 2026 the Codemagic Billing
# page showed 506 of 500 free macOS minutes used, so builds bill as overage until the reset; the owner decides when to
# start a build. Estimated run: 15 to 25 minutes (NOT measured).

workflows:
  tvos-testflight:
    name: tvOS TestFlight (manual)
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: asc-testflight
    environment:
      xcode: "27.2"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.liamp.videoplayer
      vars:
        # The same pinned XcodeGen as .github/workflows/compile-check.yml (the self-test checks they are equal).
        XCODEGEN_VERSION: "2.46.0"
        XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
    scripts:
      # Signing first: it reads only App Store Connect and the keychain (no generated project), so a signing failure stops
      # the build before the long package setup (an estimate: about 2 minutes, not measured; OPEN_QUESTIONS R266).
      - name: Signing files (the stored certificate; existing or new TVOS_APP_STORE profiles for the app and Top Shelf)
        script: bash scripts/cm-testflight.sh signing
      - name: Check the profiles' iCloud container and App Group
        script: bash scripts/cm-testflight.sh check-profiles
      - name: Prepare (check vendored files, pinned XcodeGen, generate, resolve packages)
        script: bash scripts/cm-testflight.sh prepare
      - name: Archive for tvOS devices (Release, manual signing, one profile per target)
        script: bash scripts/cm-testflight.sh archive
      - name: Export the .ipa (method app-store)
        script: bash scripts/cm-testflight.sh export
    artifacts:
      # The App Store Connect publisher uploads the .ipa listed here. Nothing else is kept (no logs: they can name the
      # certificate's holder).
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # Upload only. Internal testers need no beta review; the owner adds himself in TestFlight (docs/TESTFLIGHT.md).
        submit_to_testflight: false
