# Codemagic configuration.
# MANUAL ONLY: there is intentionally no `triggering:` block in any workflow, so
# nothing runs on push, pull request, tag or schedule. Builds start only when you
# press "Start new build" in the Codemagic UI.
#
#
# DO NOT RUN tvos-compile-check ON CODEMAGIC until the free monthly minute total has reset (2026-11-17: about 6 minutes
# left, less than the 8-minute cap). Compile checks now run on GitHub Actions instead (.github/workflows/compile-check.yml,
# docs/GITHUB_ACTIONS_RUNBOOK.md). This file and its caps stay for the TestFlight upload later.
#
# Estimated build minutes (estimates, NOT measured; the first real run will tell):
#   tvos-compile-check : about 6-8 min  (hard cap 8)
#   tvos-testflight    : about 9-13 min (hard cap 15)

workflows:
  tvos-compile-check:
    name: tvOS compile check (Simulator, no signing)
    instance_type: mac_mini_m2
    max_build_duration: 8
    environment:
      xcode: "27.2"
    cache:
      cache_paths:
        - $HOME/Library/Caches/org.swift.swiftpm
        - $HOME/Library/Developer/Xcode/DerivedData
    scripts:
      - name: Install XcodeGen
        script: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Resolve Swift packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project VideoPlayer.xcodeproj \
            -scheme VideoPlayer
      - name: Build for tvOS Simulator (no code signing)
        script: |
          set -o pipefail
          xcodebuild build \
            -project VideoPlayer.xcodeproj \
            -scheme VideoPlayer \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -quiet

  tvos-testflight:
    name: tvOS TestFlight upload (manual)
    instance_type: mac_mini_m2
    max_build_duration: 15
    integrations:
      app_store_connect: codemagic-asc   # must match the key name you give in Codemagic
    environment:
      xcode: "27.2"
      groups:
        - signing   # holds CERTIFICATE_PRIVATE_KEY as a Secure variable (never in the repo)
      vars:
        # Must equal PRODUCT_BUNDLE_IDENTIFIER in project.yml.
        BUNDLE_ID: com.liamp.videoplayer
    cache:
      cache_paths:
        - $HOME/Library/Caches/org.swift.swiftpm
    scripts:
      - name: Install XcodeGen
        script: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install xcodegen
      - name: Check bundle ID matches project.yml and generate project
        script: |
          grep -q "PRODUCT_BUNDLE_IDENTIFIER: $BUNDLE_ID\$" project.yml || { echo "BUNDLE_ID does not match project.yml"; exit 1; }
          xcodegen generate
      - name: Set up signing (tvOS App Store profile)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform TVOS \
            --type TVOS_APP_STORE \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Archive
        script: |
          set -o pipefail
          BUILD_NUMBER=$(date -u +%Y%m%d%H%M)
          xcodebuild archive \
            -project VideoPlayer.xcodeproj \
            -scheme VideoPlayer \
            -destination 'generic/platform=tvOS' \
            -archivePath build/VideoPlayer.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -quiet
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/VideoPlayer.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist "$HOME/export_options.plist"
    artifacts:
      - build/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false   # upload only; internal testers get it after Apple processing
