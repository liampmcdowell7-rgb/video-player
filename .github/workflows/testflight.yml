# TestFlight upload on GitHub Actions (OPEN_QUESTIONS R463, PROVISIONAL; it replaces the first form of this file, R244 to R252,
# which signed automatically and stopped at the archive). It does what the Codemagic workflow "tvOS TestFlight (manual)" does:
# a Release archive of the tvOS app and its Top Shelf extension, an export with the app-store method, the upload to App Store
# Connect, and (only when you tick the box) the .ipa as the one artifact. Steps for the owner: docs/TESTFLIGHT.md.
#
# MANUAL ONLY: the only trigger is workflow_dispatch (the "Run workflow" button on the Actions tab). Nothing runs on push,
# pull request, tag or schedule. Only people with write access to the repository can press the button. Two runs never
# overlap (concurrency), and a run stops by itself after 30 minutes.
#
# SECRETS: this is the ONE workflow allowed to use secrets (R248; scripts/pre-push-check.sh enforces it), and only these four
# repository secrets, which the owner adds on GitHub (docs/TESTFLIGHT.md). Nothing secret is in the repository.
#   ASC_KEY_ID              App Store Connect API key ID (Team key)
#   ASC_ISSUER_ID           the Issuer ID shown above the Team Keys table
#   ASC_KEY_P8              the text of the downloaded AuthKey_<id>.p8 file (whole, or only its middle lines: the first and
#                           last lines are rebuilt at run time, R251, so no key header is ever in the repository)
#   DIST_CERT_PRIVATE_KEY   the private key of the owner's existing Apple Distribution certificate (PEM text)
# The Team ID is NOT needed (R463): the signing profiles carry it, as they did on Codemagic. No GitHub token is used
# (permissions: contents: read; the checkout keeps no credentials). The keys are written to the runner's temporary folder
# with mode 600 and deleted in a final step that runs after a failure too. Logs: every command writes to a file; the log
# shows only result lines and, on failure, error lines with signing identities removed (scripts/ci-testflight-log.sh,
# scripts/cm-testflight.sh redact). No log is uploaded (R249).
#
# SIGNING (R463, the Codemagic route's way, which produced the TestFlight builds so far, R266): MANUAL signing, one App Store profile per
# target (the app and the Top Shelf extension), the one existing distribution certificate, no device needed. Automatic
# signing is not used: Apple's cloud signing (WWDC21 session 10204) takes the DEVELOPER-signed app in an archive and signs
# it again for distribution, and the developer signature needs a Development profile, which needs a registered Apple TV
# (R266: "Your team has no devices from which to generate a provisioning profile"). The alternative is R464.
#   1. scripts/gh-testflight.sh install-cert   the certificate that belongs to DIST_CERT_PRIVATE_KEY, into a temporary keychain
#                                              that is made the DEFAULT keychain (R469: use-profiles reads only that one)
#   2. scripts/cm-testflight.sh signing        checks it against App Store Connect; per bundle ID takes an existing active
#                                              TVOS_APP_STORE profile or makes a profile (never a certificate or a key)
#   3. scripts/cm-testflight.sh check-profiles iCloud container, App Group and aps-environment in the two profiles
#   4. scripts/cm-testflight.sh prepare        scripts/ci-prepare.sh, the same preparation as the compile check
#   5. scripts/cm-testflight.sh archive        use-profiles, build number, Release archive, build-number check; stops before the
#                                              archive when use-profiles left a target without a signing identity (R469)
#      scripts/gh-testflight.sh check-archive  (R469) read-only: per target, signed in the archive (yes/no) and a Release
#                                              CODE_SIGN_ENTITLEMENTS (yes/no, base name); stops before the export if not
#   6. scripts/cm-testflight.sh export         the .ipa (method app-store)
#      scripts/gh-testflight.sh check-entitlements  (R466, on the .ipa since R468; the archive is unsigned, this workflow signs
#                                              in the export) read-only: yes or no, never a value, for the iCloud container,
#                                              the iCloud services, the App Group and aps-environment in the app and the Top
#                                              Shelf extension of the exported .ipa; fails before the upload when the .ipa is
#                                              missing or the signed app was read and lacks the container or the CloudKit
#                                              service; when nothing can be read it warns and goes on (R467)
#   7. scripts/gh-testflight.sh upload         xcodebuild -exportArchive with destination upload and the API key
# The Codemagic command line tools (open source, pip package codemagic-cli-tools) are installed into a virtual environment
# on the runner for the steps `app-store-connect` and `xcode-project`. Unpinned until the first run shows a version (R463).
#
# MINUTES (R250; GitHub, "About billing for GitHub Actions", read 20 Nov 2026,
# https://docs.github.com/en/billing/managing-billing-for-your-products/managing-billing-for-github-actions/about-billing-for-github-actions):
#   "Standard GitHub-hosted runners in public repositories" are free and do not use the included minutes. This repository
#   is public and `xcode-27` is a standard runner (the same label and Xcode 27.2 as compile-check.yml), so a run costs
#   nothing. If the repository were made private, macOS minutes would be charged (USD 0.062 per minute at that reading).
#   NEVER use a -large / -xlarge label: larger runners are billed even when public.
#   Estimated time per run: 15 to 25 minutes (the Codemagic estimate; NOT measured here).
# BUILD NUMBER (R246): the UTC time yyyyMMddHHmm (scripts/cm-build-number.sh, taken in the archive step, which then checks
# that both bundles carry it, R279), so each upload is unique and rising.
# UPLOAD: no submission for TestFlight review; internal testers need none.
# ARTIFACT: none unless "Keep the .ipa" is ticked (default off): the .ipa carries the Team ID (profile and entitlements) and
# a public repository's artifacts can be downloaded by anyone signed in to GitHub (R463). The second box, "Keep the dSYM
# files" (default off, 1 day, R466), keeps only the archive's dSYMs folder: debug symbols (function, type and file names,
# line tables), no profile, no entitlements, no Team ID, no key. Never a log.

name: TestFlight upload (tvOS, manual)

on:
  workflow_dispatch:
    inputs:
      keep_ipa:
        description: "Keep the .ipa as a downloadable artifact (1 day). It carries your Team ID, and anyone signed in to GitHub can download artifacts of a public repository."
        type: boolean
        default: false
      keep_dsyms:
        description: "Keep the dSYM files (the symbols that turn a crash report into function names) as a downloadable artifact (1 day). They list this app's function and file names; anyone signed in to GitHub can download artifacts of a public repository."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive, sign and upload to TestFlight
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      XCODE_APP: /Applications/Xcode_27.2.app
      OUT: build/testflight
    steps:
      - name: Check out the repository (with the committed Vendor/ packages and xcframeworks)
        uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false

      - name: Check that the four secrets are set (names only, never values)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DIST_CERT_PRIVATE_KEY: ${{ secrets.DIST_CERT_PRIVATE_KEY }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Check secrets"
          bad=0
          for n in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 DIST_CERT_PRIVATE_KEY; do
            if [ -z "${!n}" ]; then echo "::error::The repository secret $n is missing (docs/TESTFLIGHT.md, the secrets)."; bad=1; else echo "ok      $n is set"; fi
          done
          [ "$bad" -eq 0 ] || exit 1
          # The API key's body (base64) must be there; its first and last lines are optional (built at run time, R251).
          body="$(printf '%s\n' "$ASC_KEY_P8" | grep -v -- '-----' | tr -d ' \r\n\t')"
          if [ "${#body}" -ge 100 ] && printf '%s' "$body" | grep -Eq '^[A-Za-z0-9+/]+=*$'; then
            echo "ok      ASC_KEY_P8 holds a key body of ${#body} base64 characters"
          else
            echo "::error::ASC_KEY_P8 must be the text of the .p8 file (open it in Notepad, select all, copy, paste; docs/TESTFLIGHT.md)."; exit 1
          fi
          if printf '%s\n' "$DIST_CERT_PRIVATE_KEY" | grep -q -- '-----'; then echo "ok      DIST_CERT_PRIVATE_KEY looks like PEM text"
          else echo "::error::DIST_CERT_PRIVATE_KEY must be the PEM text of the private key, with its first and last lines (docs/TESTFLIGHT.md)."; exit 1; fi

      - name: Read the XcodeGen pin from compile-check.yml (one source) and select Xcode 27.2
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Pins, select Xcode"
          set -euo pipefail
          # compile-check.yml holds the pinned XcodeGen release and its SHA-256 (release page
          # https://github.com/yonaskolb/XcodeGen/releases/tag/2.46.0); this workflow reads them from there, so the two cannot drift.
          v="$(sed -nE 's/^[[:space:]]+XCODEGEN_VERSION: "([^"]+)"$/\1/p' .github/workflows/compile-check.yml | sort -u)"
          s="$(sed -nE 's/^[[:space:]]+XCODEGEN_SHA256: "([^"]+)"$/\1/p' .github/workflows/compile-check.yml | sort -u)"
          [ "$(printf '%s\n' "$v" | wc -l)" -eq 1 ] && printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::no single XcodeGen version in compile-check.yml"; exit 1; }
          [ "$(printf '%s\n' "$s" | wc -l)" -eq 1 ] && printf '%s' "$s" | grep -Eq '^[0-9a-f]{64}$' || { echo "::error::no single XcodeGen SHA-256 in compile-check.yml"; exit 1; }
          echo "XCODEGEN_VERSION=$v" >> "$GITHUB_ENV"
          echo "XCODEGEN_SHA256=$s" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install the command line tools for signing (virtual environment, no secrets in this step)
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Install the signing tools"
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/cli"
          "$RUNNER_TEMP/cli/bin/pip" install --quiet codemagic-cli-tools
          echo "$RUNNER_TEMP/cli/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cli/bin/pip" show codemagic-cli-tools | sed -n '1,2p'

      - name: Write the keys to the runner's temporary folder (mode 600) and install the certificate
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DIST_CERT_PRIVATE_KEY: ${{ secrets.DIST_CERT_PRIVATE_KEY }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Keys and certificate"
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          # R251: the API key file is rebuilt from the secret's base64 body, 64 characters per line, between a first and last
          # line assembled here from their words, so neither the repository nor the log ever holds a key header.
          kind="PRIVATE"
          first="-----BEGIN $kind KEY-----"
          last="-----END $kind KEY-----"
          body="$(printf '%s\n' "$ASC_KEY_P8" | grep -v -- '-----' | tr -d ' \r\n\t')"
          { echo "$first"; printf '%s\n' "$body" | fold -w 64; echo "$last"; } > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          unset body
          printf '%s\n' "$DIST_CERT_PRIVATE_KEY" > "$RUNNER_TEMP/asc/dist.key"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" "$RUNNER_TEMP/asc/dist.key"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
          echo "DIST_KEY_FILE=$RUNNER_TEMP/asc/dist.key" >> "$GITHUB_ENV"
          export APP_STORE_CONNECT_KEY_IDENTIFIER="$ASC_KEY_ID" APP_STORE_CONNECT_ISSUER_ID="$ASC_ISSUER_ID"
          export APP_STORE_CONNECT_PRIVATE_KEY="@file:$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          export DIST_KEY_FILE="$RUNNER_TEMP/asc/dist.key"
          bash scripts/gh-testflight.sh install-cert

      - name: Signing files (the existing certificate; existing or new TVOS_APP_STORE profiles for the app and Top Shelf)
        timeout-minutes: 10
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Signing files"
          export APP_STORE_CONNECT_KEY_IDENTIFIER="$ASC_KEY_ID" APP_STORE_CONNECT_ISSUER_ID="$ASC_ISSUER_ID"
          export APP_STORE_CONNECT_PRIVATE_KEY="@file:$ASC_KEY_PATH"
          bash scripts/cm-testflight.sh signing
          bash scripts/cm-testflight.sh check-profiles

      - name: Prepare (check vendored files, pinned XcodeGen, generate, resolve packages)
        timeout-minutes: 15
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Prepare (vendored files, XcodeGen, generate, resolve)"
          bash scripts/cm-testflight.sh prepare

      - name: Archive for tvOS devices (Release, manual signing, one profile per target)
        timeout-minutes: 25
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Archive (Release, tvOS devices, manual signing)"
          bash scripts/cm-testflight.sh archive

      - name: Check the archive is signed and has an entitlements file (read-only; yes or no only, never a value)
        timeout-minutes: 5
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Archive check (signed, entitlements file)"
          bash scripts/gh-testflight.sh check-archive

      - name: Export the .ipa (method app-store)
        timeout-minutes: 10
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Export"
          bash scripts/cm-testflight.sh export

      - name: Check the signed entitlements of the exported .ipa (read-only; yes or no only, never a value; stops if the .ipa is missing or the signed app lacks iCloud)
        timeout-minutes: 5
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Entitlement check (.ipa)"
          bash scripts/gh-testflight.sh check-entitlements

      - name: Upload to App Store Connect (TestFlight; no submission for review)
        timeout-minutes: 15
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Upload"
          bash scripts/gh-testflight.sh upload

      - name: Keep the .ipa (only when the box was ticked)
        if: ${{ inputs.keep_ipa }}
        uses: actions/upload-artifact@v7
        with:
          name: testflight-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 1
          if-no-files-found: error

      - name: Keep the dSYM files (only when the box was ticked; also after a failed step)
        if: ${{ always() && inputs.keep_dsyms }}
        uses: actions/upload-artifact@v7
        with:
          name: testflight-dsyms
          path: build/ios/xcarchive/VideoPlayer.xcarchive/dSYMs
          retention-days: 1
          if-no-files-found: warn

      - name: Delete the keys, the temporary keychain and the logs (always, also after a failure)
        if: always()
        run: bash scripts/gh-testflight.sh cleanup

      - name: Summary
        if: always()
        run: |
          {
            echo "## TestFlight upload"
            echo
            echo "The build number is the UTC time of the archive step (its log line 'Build number (CFBundleVersion)')."
            echo
            echo "If every step is green: App Store Connect > your app > TestFlight shows the build as Processing, then ready"
            echo "(docs/TESTFLIGHT.md). If a step is red: copy its error lines (docs/TESTFLIGHT.md, 'If a step is red')."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          bash scripts/ci-stage.sh --summary "TestFlight upload"
