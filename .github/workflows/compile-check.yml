      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false

      - name: Prepare (select Xcode, check vendored files, install XcodeGen, generate, resolve)
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Prepare (select Xcode, check vendored files, install XcodeGen, generate, resolve)"
          bash scripts/ci-prepare.sh

      # Runtime lists, pick (runtime first: the one matching the Simulator SDK, else the newest; then the device name), then
      # the stage "Boot and retry": boot and wait; one retry, on the next runtime when this one failed to load (#21 A,
      # scripts/ci-sim.sh).
      - name: Pick the simulator (newest tvOS runtime matching the SDK first), then boot it (stage "Boot and retry")
        timeout-minutes: 8
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Pick the simulator (newest tvOS runtime matching the SDK first)"
          bash scripts/ci-sim.sh prepare

      # Ad-hoc signing for this simulator build (OPEN_QUESTIONS R164, PROVISIONAL): identity "-" with no team, no profile and
      # no secret, so the entitlements in project.yml (App Group, iCloud, Keychain group) are embedded in the app. Whether the
      # simulator then APPLIES them is not stated on an Apple page: the next step prints what is embedded. If ad-hoc signing
      # fails the build, the job builds again unsigned (as before) and says so; the app must start either way (launch safety).
      - name: Build the app and the UI tests (Debug, simulator, ad-hoc signed; unsigned if that fails)
        id: build
        run: bash scripts/ci-build-uitests.sh

      - name: Show what the built app carries (signature, embedded entitlements, Info.plist scene keys)
        if: steps.build.outcome == 'success'
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Show what the built app carries (signature, embedded entitlements, Info.plist scene keys)"
          set -uo pipefail
          echo "Signing mode used: $SIGNING"
          # Apple's documented check ("Diagnosing Issues with Entitlements"): codesign --display --entitlements :- App.app
          codesign --display --verbose=2 "$APP_PATH" 2>&1 | tee "$OUT/app-signature.txt" || true
          codesign --display --entitlements :- "$APP_PATH" 2>&1 | tee "$OUT/app-entitlements.txt" || true
          plutil -p "$APP_PATH/Info.plist" | grep -A6 -E 'UIApplicationSceneManifest|UILaunchScreen|UIRequiredDeviceCapabilities' || true
          xcrun simctl help launch 2>&1 | tee "$OUT/simctl-launch-help.txt" | sed -n '1,40p' || true

      # LAUNCH SMOKE: before the UI tests, launch the app twice (no arguments, then -UITestEmpty) and check it is still running
      # after 8 s. On a crash the step prints the crash reports, the app's log and console output (scripts/ci-launch-smoke.sh)
      # and fails. "LAUNCH OK (<label>)" in the log is the proof the app stays up.
