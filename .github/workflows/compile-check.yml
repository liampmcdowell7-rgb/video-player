  # JOB 4. Screenshots, part 1 of 2: first launch, Add a Source, Settings, Files, Search, the Shows toolbar, the sorting
  # screens (UITests/ScreenshotTests.swift tests 01, 02, 03, 05, 14, 10, in that order: test10, the longest, last; #34 4
  # moved test12 and test13, the player clip and the synopsis pages, to part 2), on a tvOS Simulator, with the debug-only sample library (launch arguments -UITestEmpty /
  # -UITestFixtures, App/Support/UITestMode.swift; R160). Part 2 (test04: Home, Movies, Shows, the detail pages) is job 4b.
  # SPLIT (#24 B, docs/COVERAGE.md "UI-test jobs"): measured on fa00af8, test01 68 s, test02 36 s, test03 148 s, test05 39 s,
  # test10 312 s (test12, 13 and 14 were never reached: about 90 s each, an estimate), about 15 minutes in all, 80 planned
  # pictures. Tests 06 and 11 are job 5; tests 07-09 run in no job (OPEN_QUESTIONS R197). Every test is named in exactly
  # one job, so a new test must be added to one of them and to scripts/screenshot-plan.tsv.
  # The uploads run whatever happened before them (if: always()).
  screenshots:
    name: Screenshots, part 1 (setup, Settings, sorting; tvOS Simulator, UI tests)
    needs: compile   # #23 E: runs only when job 1 compiled the app; otherwise job "not-taken" says so
    runs-on: xcode-27
    timeout-minutes: 75   # #24 B, R367: hard cap; the tests stop after 40 minutes (CI_TEST_BUDGET_SECONDS)
    env:
      XCODE_APP: /Applications/Xcode_27.2.app
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
      OUT: build/ci
      # #24 B: 25 minutes for the UI tests, counted from the start of the first one (scripts/ci-sim.sh), so a slow build
      # no longer eats the test time. Prepare, boot, build and smoke took about 12 minutes on fa00af8; 12 + 25 + the
      # collect, check and upload steps stays well inside the 60-minute job cap.
      # R367 (compile run of 21 Nov 2026, item 15): 40 minutes. Run 8 stopped part 1 in test10 at 25:11 and part 2 in
      # test16 at 24:17, each the last test of its job, so planned pictures were not taken. Standard runners are free
      # in a public repository (docs/GITHUB_ACTIONS_RUNBOOK.md, Cost); about 12 + 40 + collect and upload stays inside 75.
