      # #24 A: one xcodebuild call per test (scripts/ci-ui-tests.sh), each with its own result bundle; after each call that
      # test's pictures are copied into the artifact folder at once (from the PNG files the test writes, else from the
      # simulator's data folder, else from a complete bundle) and index.md is written. A failed test does not stop the
