# Compile check: SEVEN INDEPENDENT JOBS that run in parallel from one press of "Run workflow" (OPEN_QUESTIONS R161).
# No job depends on another (no `needs:`), so a failing job never stops or hides the others. Each job has its own
# 30-minute timeout, its own error summary in the run page and its own artifact. Every upload step has `if: always()`, so
# it runs after a failed step too; the long steps have their own (shorter) timeout-minutes so that a slow step still
# leaves time for the export and the uploads. Every job ends its summary with "Stage times" (scripts/ci-stage.sh): how
# long each stage took.
#   1. compile           the app and its Top Shelf extension for the tvOS Simulator (unchanged from the second compile check)
#   2. device-build      the same two targets for a real Apple TV (Release, arm64, unsigned) and an inspection of the .app
#   3. simulator-tests   the package unit tests (VideoPlayerCore) on a tvOS Simulator; counts are a report, not a gate
#   4. screenshots       a launch smoke (the app must still be running 8 s after launch, plain and -UITestEmpty; the
#                        cause is printed in the log if not), then UI tests that take a named screenshot of every screen
#                        they can reach, with debug-only sample data: part 1 (tests 01, 02, 03, 10, 12)
#   4b. screenshots-library   the same, part 2 (tests 04, 05, 13: library and detail pages). Split from job 4 by #21 B so
#                        neither part is cut off by the time budget (projection: docs/GITHUB_ACTIONS_RUNBOOK.md)
#   5. accessibility-screenshots   eleven screens under Larger Text and Bold Text (drawn by the app) and at the default
#                        size, and a check that the first two differ from the default outside the tab bar (rule 17, R170)
#   6. accessibility-settings-screenshots   five screens under Increase Contrast, Reduce Transparency and Reduce Motion,
#                        each turned on in the simulator. Jobs 5 and 6 were one job until #16 item 1.10: with eleven
#                        screens it would not fit in 30 minutes. Both are built exactly as job 4
# docs/GITHUB_ACTIONS_RUNBOOK.md says what to download and what to send back.
#
# MANUAL ONLY: the only trigger is workflow_dispatch (the "Run workflow" button on the Actions tab). Nothing runs on push,
# pull request, tag or schedule. It uses NO secrets.
#
# Runner (checked 2026-11-17, see docs/GITHUB_ACTIONS_RUNBOOK.md):
#   `xcode-27` is generally available (GitHub changelog 2026-10-15, "Xcode 27 runner image generally available",
#   https://github.blog/changelog/2026-10-15-xcode-27-runner-image-generally-available/). It is a STANDARD GitHub-hosted runner (3 CPU M1, 7 GB RAM, 14 GB SSD, arm64), listed in the standard-runner table of
#   https://docs.github.com/en/actions/reference/github-hosted-runners-reference . Standard runners are free for public
#   repositories (https://docs.github.com/en/billing/concepts/product-billing/github-actions).
#   Its image (https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md) has Xcode 27.0, 27.1
#   (default) and 27.2, with the tvOS 27.2 SDK and tvOS 27.2 Simulator SDK (Xcode 27.2). This workflow selects Xcode 27.2, the
#   same version codemagic.yaml uses.
#   NEVER change runs-on to a label ending in -large or -xlarge (for example `xcode-27-xlarge`, `macos-26-xlarge`): those are
#   larger runners, which are billed even for public repositories.
#
# Build settings for this check only: arm64 simulator slice, whole-module compile, continue after errors (see the build
# step; OPEN_QUESTIONS R158, R159). Expected run time is about 15 minutes or less; timeout-minutes is only the ceiling.
#
# It does not archive and does not upload anything to Apple. Nothing is signed with a certificate: jobs 1 to 3 are unsigned;
# jobs 4, 4b, 5 and 6 sign AD HOC (identity "-", no team, no profile, no secret) so the simulator app carries its entitlements (R164). Jobs 2 to 5 share their preparation steps through
# scripts/ci-prepare.sh (the same steps job 1 spells out).

name: Compile check (tvOS Simulator, no signing)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: compile-check
  cancel-in-progress: false

jobs:
  compile:
    name: Build app + Top Shelf (Simulator)
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      XCODE_APP: /Applications/Xcode_27.2.app
      # XcodeGen is pinned to a release and its published SHA-256 (from the release page
      # https://github.com/yonaskolb/XcodeGen/releases/tag/2.46.0, asset xcodegen.zip). A mismatch stops the job.
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
      OUT: build/ci
    steps:
      - name: Check out the repository (with the committed Vendor/ packages and xcframeworks)
        uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false

      - name: Select Xcode 27.2 and show the tvOS SDKs
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Select Xcode 27.2 and show the tvOS SDKs"
          set -euo pipefail
          mkdir -p "$OUT"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version | tee "$OUT/xcode-version.txt"
          xcodebuild -showsdks | tee -a "$OUT/xcode-version.txt"
          xcodebuild -showsdks | grep -q 'appletvsimulator27' || { echo "::error::No tvOS 27 Simulator SDK on this runner"; exit 1; }

      - name: Check the committed vendored packages and binary frameworks
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Check the committed vendored packages and binary frameworks"
          set -euo pipefail
          P=Packages/VideoPlayerCore
          missing=0
          # Package.swift declares SourceSFTPCitadel and the real SMB backend ONLY when these manifests exist.
          for f in "$P/Vendor/AMSMB2/Package.swift" "$P/Vendor/Citadel/Package.swift" "$P/Vendor/swift-nio-ssh/Package.swift"; do
            if [ -f "$f" ]; then echo "ok      $f"; else echo "::error::missing $f"; missing=1; fi
          done
          # Every binaryTarget path in Package.swift must be present and must be real files, not Git LFS pointers.
          # This also covers the media-engine frameworks (FFmpeg libraries, libdovi) once they are added to Package.swift.
          # A path built with string interpolation (Frameworks/MediaCodecs/\(name).xcframework) is expanded to every
          # .xcframework in that folder; the folder must not be empty.
          grep -oE 'path: *"[^"]+\.xcframework"' "$P/Package.swift" | sed -E 's/path: *"([^"]+)"/\1/' | sort -u > "$OUT/binary-target-paths.txt" || true
          : > "$OUT/binary-targets.txt"
          while read -r rel; do
            case "$rel" in
              *'\('*)
                dir="$(dirname "$rel")"
                n=0
                for x in "$P/$dir"/*.xcframework; do [ -d "$x" ] && echo "${x#$P/}" >> "$OUT/binary-targets.txt" && n=$((n + 1)); done
                [ "$n" -gt 0 ] || { echo "::error::no .xcframework in $P/$dir (Package.swift expects some: $rel)"; missing=1; } ;;
              *) echo "$rel" >> "$OUT/binary-targets.txt" ;;
            esac
          done < "$OUT/binary-target-paths.txt"
          while read -r rel; do
            [ -n "$rel" ] || continue
            d="$P/$rel"
            if [ ! -f "$d/Info.plist" ]; then echo "::error::binary target $d is missing (not committed?)"; missing=1; continue; fi
            if grep -rIl -m1 '^version https://git-lfs.github.com/spec' "$d" >/dev/null 2>&1; then
              echo "::error::$d contains Git LFS pointer files instead of the real binaries"; missing=1; continue
            fi
            echo "ok      $d ($(du -sh "$d" | cut -f1))"
          done < "$OUT/binary-targets.txt"
          echo "All xcframeworks in the checkout:"; find . -maxdepth 6 -type d -name '*.xcframework' -print
          exit $missing

      - name: Install XcodeGen ${{ env.XCODEGEN_VERSION }} (pinned release, SHA-256 checked)
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Install XcodeGen {{ env.XCODEGEN_VERSION }} (pinned release, SHA-256 checked)"
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xcodegen"
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          BIN="$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen -perm -u+x | head -n1)"
          [ -n "$BIN" ] || { echo "::error::xcodegen binary not found in the release zip"; exit 1; }
          echo "$(dirname "$BIN")" >> "$GITHUB_PATH"
          "$BIN" --version

      - name: Generate the Xcode project
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Generate the Xcode project"
          set -euo pipefail
          xcodegen generate --spec project.yml 2>&1 | tee "$OUT/xcodegen.log"
          xcodebuild -list -project VideoPlayer.xcodeproj | tee "$OUT/schemes.txt"

      - name: Resolve Swift packages
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Resolve Swift packages"
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project VideoPlayer.xcodeproj \
            -scheme VideoPlayer \
            -clonedSourcePackagesDirPath build/SourcePackages \
            2>&1 | tee "$OUT/resolve.log"

      - name: Build for the tvOS Simulator (app + Top Shelf extension, no code signing)
        id: build
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Build for the tvOS Simulator (app + Top Shelf extension, no code signing)"
          set -euo pipefail
          # The VideoPlayer scheme builds the app target and, as its embedded dependency, the TopShelf extension target.
          #
          # ALL ERRORS IN ONE RUN (OPEN_QUESTIONS R158). The second compile stopped after the first failing batch, so errors
          # in other files of the same module were never reported. Settings below apply to this check only, not to
          # project.yml or codemagic.yaml:
          #   SWIFT_COMPILATION_MODE=wholemodule  one compiler job per module type-checks every file of that module and
          #                                       reports all their errors together. There are then no batches, so a
          #                                       separate "batch mode off" setting has nothing to switch off.
          #   -continue-building-after-errors     Swift driver option ("Continue building, even after errors are
          #                                       encountered"; attributes frontend, doesNotAffectIncrementalBuild), from
          #                                       swift-driver Sources/SwiftOptions/Options.swift. Passed through
          #                                       OTHER_SWIFT_FLAGS with $(inherited) so target flags are kept.
          #   -IDEBuildingContinueBuildingAfterErrors=YES  an xcodebuild "-userdefault=value" (documented form). The NAME of
          #                                       this default is NOT on any Apple page read; PROVISIONAL. If a run reports it
          #                                       as unknown or errors on it, delete that one line. The log shows whether other
          #                                       targets kept building after an error.
          # A module that depends on a module with errors still cannot be compiled, so errors there appear only in a
          # later run.
          #
          # ARM64 ONLY (OPEN_QUESTIONS R159): ARCHS=arm64 ONLY_ACTIVE_ARCH=YES builds one simulator slice instead of two,
          # which roughly halves the compile time (the runner is arm64). This does NOT prove that the x86_64 simulator slice
          # compiles or links.
          xcodebuild build \
            -project VideoPlayer.xcodeproj \
            -scheme VideoPlayer \
            -configuration Debug \
            -destination 'generic/platform=tvOS Simulator' \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -derivedDataPath build/DerivedData \
            -resultBundlePath "$OUT/Build.xcresult" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -IDEBuildingContinueBuildingAfterErrors=YES \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            SWIFT_COMPILATION_MODE=wholemodule \
            'OTHER_SWIFT_FLAGS=$(inherited) -continue-building-after-errors' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$OUT/build.log"

      - name: Summarise errors (file, line, message)
        if: always()
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Summarise errors (file, line, message)"
          set -uo pipefail
          touch "$OUT/build.log"
          # Compiler and linker errors from the full log, de-duplicated, as "file:line: message".
          grep -E '(^|[[:space:]])(/[^:]+):([0-9]+):([0-9]+:)? (fatal )?error: ' "$OUT/build.log" \
            | sed -E 's#^[^/]*(/[^:]+):([0-9]+):([0-9]+:)? (fatal )?error: (.*)$#\1:\2: \5#' \
            | sed -E "s#^$GITHUB_WORKSPACE/##" \
            | sort -u > "$OUT/errors.txt" || true
          # Errors without a file position (missing package, missing SDK, signing, linker summary lines).
          grep -E '^(error|xcodebuild: error|ld: |clang: error|.*error: )' "$OUT/build.log" "$OUT/resolve.log" "$OUT/xcodegen.log" 2>/dev/null \
            | grep -vE '(^|[[:space:]])/[^:]+:[0-9]+:([0-9]+:)? (fatal )?error: ' | sort -u > "$OUT/errors-other.txt" || true
          if [ -d "$OUT/Build.xcresult" ]; then
            xcrun xcresulttool get build-results --path "$OUT/Build.xcresult" > "$OUT/xcresult-build-results.json" 2>"$OUT/xcresulttool.stderr" || true
          fi
          n=$(wc -l < "$OUT/errors.txt" | tr -d ' ')
          m=$(wc -l < "$OUT/errors-other.txt" | tr -d ' ')
          {
            echo "## Compile check: $n compiler errors with a file position, $m other error lines"
            echo
            echo '```'
            head -n 150 "$OUT/errors.txt"
            [ "$n" -gt 150 ] && echo "... ($n in total; all of them are in errors.txt in the artifact)"
            echo '--- other error lines ---'
            head -n 50 "$OUT/errors-other.txt"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stage times
        if: always()
        run: bash scripts/ci-stage.sh --summary "Compile"

      - name: Upload the build log, error lists and xcresult summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compile-check-results
          path: |
            build/ci/*.txt
            build/ci/*.log
            build/ci/*.md
            build/ci/*.json
            build/ci/xcresulttool.stderr
          if-no-files-found: warn
          retention-days: 14

  # JOB 2. A real-device build: proves the device (tvos-arm64) slices of every binary framework link, which the simulator
  # build cannot. Release configuration, so it also proves the debug-only UI-test sample library is compiled out.
  device-build:
    name: Build app + Top Shelf (Apple TV device, Release, unsigned)
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      XCODE_APP: /Applications/Xcode_27.2.app
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
      OUT: build/ci
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false

      - name: Prepare (select Xcode, check vendored files, install XcodeGen, generate, resolve)
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Prepare (select Xcode, check vendored files, install XcodeGen, generate, resolve)"
          bash scripts/ci-prepare.sh

      - name: Build for tvOS devices (arm64, Release, no code signing)
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Build for tvOS devices (arm64, Release, no code signing)"
          set -euo pipefail
          # -sdk appletvos with generic/platform=tvOS builds for a real Apple TV without needing one. Same all-errors
          # settings as job 1 (OPEN_QUESTIONS R158).
          xcodebuild build \
            -project VideoPlayer.xcodeproj \
            -scheme VideoPlayer \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -derivedDataPath build/DerivedData \
            -resultBundlePath "$OUT/DeviceBuild.xcresult" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -IDEBuildingContinueBuildingAfterErrors=YES \
            ARCHS=arm64 \
            SWIFT_COMPILATION_MODE=wholemodule \
            'OTHER_SWIFT_FLAGS=$(inherited) -continue-building-after-errors' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$OUT/build.log"

      - name: Summarise errors (file, line, message)
        if: always()
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Summarise errors (file, line, message)"
          bash scripts/ci-summarise-errors.sh "Device build" "$OUT/build.log" "$OUT/resolve.log" "$OUT/xcodegen.log"

      - name: Inspect the device app (embedded frameworks, slices, platform tags, linked libraries, Release has no sample data)
        if: always()
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Inspect the device app (embedded frameworks, slices, platform tags, linked libraries, Release has no sample data)"
          bash scripts/ci-inspect-device-app.sh

      - name: Stage times
        if: always()
        run: bash scripts/ci-stage.sh --summary "Device build"

      - name: Upload the device build results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-build-results
          path: |
            build/ci/*.txt
            build/ci/*.log
            build/ci/*.md
          if-no-files-found: warn
          retention-days: 14

  # JOB 3. The package unit tests on a tvOS Simulator. Tests that need a live server, iCloud, a command-line tool or a
  # sample file that is not in the repository skip themselves (XCTSkip). A report, not a gate: failures are listed, and
  # the job is red when a test failed, but the counts are not checked against floors.
  simulator-tests:
    name: Package tests (tvOS Simulator)
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      XCODE_APP: /Applications/Xcode_27.2.app
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
      OUT: build/ci
      # #16 item 1.8: every test run must end 1500 s after this job's first stage (scripts/ci-sim.sh, time budget), so
      # the summary, export and upload steps after it still fit in the 30-minute job cap even when the build was slow.
      CI_TEST_DEADLINE_SECONDS: "1500"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false

      - name: Select Xcode 27.2
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Select Xcode 27.2"
          set -euo pipefail
          mkdir -p "$OUT"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version | tee "$OUT/xcode-version.txt"

      # Runtime lists, pick (runtime first: the one matching the Simulator SDK, else the newest; then the device name), then
      # the stage "Boot and retry": boot and wait; one retry, on the next runtime when this one failed to load (#21 A,
      # scripts/ci-sim.sh).
      - name: Pick the simulator (newest tvOS runtime matching the SDK first), boot and retry
        timeout-minutes: 8
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Pick the simulator (newest tvOS runtime matching the SDK first), boot and retry"
          bash scripts/ci-sim.sh prepare

      # Seconds, before the long package-test build: a test target that uses one of our type names bare while a tvOS SDK
      # framework declares the same name (LibraryItem, #15 item 1.1) is named here instead of failing deep in the build.
      - name: Check test targets for type names the tvOS SDK also declares
        timeout-minutes: 5
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Check test targets for type names the tvOS SDK also declares"
          bash scripts/ci-ambiguous-types.sh "$(xcrun --sdk appletvsimulator --show-sdk-path)" Packages/VideoPlayerCore

      - name: Run the package tests (VideoPlayerCore-Package scheme)
        working-directory: Packages/VideoPlayerCore
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Run the package tests (VideoPlayerCore-Package scheme)"
          set -euo pipefail
          # Tests that read the checkout (NamesTests, AttributionNoticeTests, UITestLaunchTests) find it through
          # VP_PROJECT_ROOT. xcodebuild hands the test process only variables prefixed TEST_RUNNER_ (prefix removed); the
          # man page lines that say so are printed here so the run shows it. Without it those tests are reported SKIPPED.
          export TEST_RUNNER_VP_PROJECT_ROOT="$GITHUB_WORKSPACE"
          man xcodebuild 2>/dev/null | col -b | grep -n -B1 -A3 'TEST_RUNNER_' | head -n 20 || echo "(no TEST_RUNNER_ text in man xcodebuild)"
          # One test at a time, so the log lines are in order and per-target counts are exact. ci-sim.sh test retries once
          # only for "Failed to load requested runtime bundle" / "Failed to prepare device"; a failing test is not retried.
          bash "$GITHUB_WORKSPACE/scripts/ci-sim.sh" test "$GITHUB_WORKSPACE/$OUT/test.log" -- xcodebuild test \
            -scheme VideoPlayerCore-Package \
            -destination "platform=tvOS Simulator,id=$SIM_UDID" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/PackageDerivedData" \
            -resultBundlePath "$GITHUB_WORKSPACE/$OUT/PackageTests.xcresult" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -parallel-testing-enabled NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Report (passed, skipped, failed per test target; failures listed)
        if: always()
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Report (passed, skipped, failed per test target; failures listed)"
          set -uo pipefail
          bash scripts/ci-summarise-errors.sh "Package tests: build" "$OUT/test.log"
          python3 scripts/ci-test-report.py "$OUT/test.log" "$OUT/test-report.md" | tee -a "$GITHUB_STEP_SUMMARY"
          # The WSL floor check, as a report only (its floors are for the Linux runs; this stage has none recorded).
          bash scripts/test-counts.sh tvos-simulator "$OUT/test.log" > "$OUT/test-counts.txt" 2>&1 || true
          if [ -d "$OUT/PackageTests.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "$OUT/PackageTests.xcresult" > "$OUT/xcresult-test-summary.json" 2>"$OUT/xcresulttool.stderr" || true
          fi

      - name: Stage times
        if: always()
        run: bash scripts/ci-stage.sh --summary "Package tests"

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-test-results
          path: |
            build/ci/*.txt
            build/ci/*.log
            build/ci/*.md
            build/ci/*.json
            build/ci/xcresulttool.stderr
          if-no-files-found: warn
          retention-days: 14

  # JOB 4. Screenshots, part 1 of 2: first launch, Add a Source, Settings, the sorting screens (UITests/ScreenshotTests.swift,
  # tests 01, 02, 03, 10, 12 the player clip), on a tvOS Simulator, with the debug-only sample library (launch arguments -UITestEmpty /
  # -UITestFixtures, App/Support/UITestMode.swift; R160). Part 2 (Home, Movies, Shows, the detail pages, Files, Search,
  # Discover; tests 04, 05, 13) is job 4b. SPLIT (#21 B, docs/GITHUB_ACTIONS_RUNBOOK.md "Run time budget"): the last run spent
  # 10:43 on 39 screenshots (16.5 s each); the set has 68 now and about 84 with #21 C-G, about 23 minutes of UI tests in
  # one job against the 13:49 left before the 22-minute deadline. Each part now has about 41-43 (about 11-12 minutes).
  # Tests 06-09 and 11 are the accessibility screenshots: jobs 5 and 6. Every test is named in exactly one job
  # (-only-testing), so a new test must be added to one of them.
  # The UI-test step has its own cap (step timeout-minutes) so the export and the uploads below
  # still have time to run when the tests are slow; the uploads run whatever happened before them (if: always()).
  screenshots:
    name: Screenshots, part 1 (setup, Settings, sorting; tvOS Simulator, UI tests)
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      XCODE_APP: /Applications/Xcode_27.2.app
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
      OUT: build/ci
      # #16 item 1.8: every test run must end 1320 s after this job's first stage (scripts/ci-sim.sh, time budget), so
      # the summary, export and upload steps after it still fit in the 30-minute job cap even when the build was slow.
      CI_TEST_DEADLINE_SECONDS: "1320"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false

      - name: Prepare (select Xcode, check vendored files, install XcodeGen, generate, resolve)
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Prepare (select Xcode, check vendored files, install XcodeGen, generate, resolve)"
          bash scripts/ci-prepare.sh

      # Runtime lists, pick (runtime first: the one matching the Simulator SDK, else the newest; then the device name), then
      # the stage "Boot and retry": boot and wait; one retry, on the next runtime when this one failed to load (#21 A,
      # scripts/ci-sim.sh).
      - name: Pick the simulator (newest tvOS runtime matching the SDK first), boot and retry
        timeout-minutes: 8
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Pick the simulator (newest tvOS runtime matching the SDK first), boot and retry"
          bash scripts/ci-sim.sh prepare

      # Ad-hoc signing for this simulator build (OPEN_QUESTIONS R164, PROVISIONAL): identity "-" with no team, no profile and
      # no secret, so the entitlements in project.yml (App Group, iCloud, Keychain group) are embedded in the app. Whether the
      # simulator then APPLIES them is not stated on an Apple page: the next step prints what is embedded. If ad-hoc signing
      # fails the build, the job builds again unsigned (as before) and says so; the app must start either way (launch safety).
      - name: Build the app and the UI tests (Debug, simulator, ad-hoc signed; unsigned if that fails)
        id: build
        run: bash scripts/ci-build-uitests.sh

      - name: Show what the built app carries (signature, embedded entitlements, Info.plist scene keys)
        if: steps.build.outcome == 'success'
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Show what the built app carries (signature, embedded entitlements, Info.plist scene keys)"
          set -uo pipefail
          echo "Signing mode used: $SIGNING"
          # Apple's documented check ("Diagnosing Issues with Entitlements"): codesign --display --entitlements :- App.app
          codesign --display --verbose=2 "$APP_PATH" 2>&1 | tee "$OUT/app-signature.txt" || true
          codesign --display --entitlements :- "$APP_PATH" 2>&1 | tee "$OUT/app-entitlements.txt" || true
          plutil -p "$APP_PATH/Info.plist" | grep -A6 -E 'UIApplicationSceneManifest|UILaunchScreen|UIRequiredDeviceCapabilities' || true
          xcrun simctl help launch 2>&1 | tee "$OUT/simctl-launch-help.txt" | sed -n '1,40p' || true

      # LAUNCH SMOKE: before the UI tests, launch the app twice (no arguments, then -UITestEmpty) and check it is still running
      # after 8 s. On a crash the step prints the crash reports, the app's log and console output (scripts/ci-launch-smoke.sh)
      # and fails. "LAUNCH OK (<label>)" in the log is the proof the app stays up.
      - name: Launch smoke (plain launch and -UITestEmpty; prints the cause if the app dies)
        id: smoke
        if: steps.build.outcome == 'success'
        timeout-minutes: 4
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Launch smoke (plain launch and -UITestEmpty; prints the cause if the app dies)"
          set -uo pipefail
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          status=0
          bash scripts/ci-launch-smoke.sh "$SIM_UDID" plain 2>&1 | tee "$OUT/launch-smoke-plain.log" || status=1
          bash scripts/ci-launch-smoke.sh "$SIM_UDID" uitest-empty -UITestEmpty 2>&1 | tee "$OUT/launch-smoke-uitest-empty.log" || status=1
          {
            echo "## Launch smoke (signing: $SIGNING)"
            grep -hE '^LAUNCH (OK|FAILED)' "$OUT"/launch-smoke-*.log || echo "no result line"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status

      # The UI tests run even when the smoke step failed, so the xcresult (with its crash reports and screen recording)
      # exists for the export below. Only this part's tests run (-only-testing); the others are job 4b, 5 and 6.
      # Step cap 20 minutes: whatever the tests captured until then is still exported and uploaded.
      - name: Run the screenshot UI tests (Debug, simulator, built above)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Run the screenshot UI tests (Debug, simulator, built above)"
          set -euo pipefail
          bash scripts/ci-sim.sh test "$OUT/test.log" -- xcodebuild test-without-building \
            -project VideoPlayer.xcodeproj \
            -scheme VideoPlayerUITests \
            -configuration Debug \
            -destination "platform=tvOS Simulator,id=$SIM_UDID" \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -derivedDataPath build/DerivedData \
            -resultBundlePath "$OUT/Screenshots.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:VideoPlayerUITests/ScreenshotTests/test01_FirstLaunchAndEmptyScreens \
            -only-testing:VideoPlayerUITests/ScreenshotTests/test02_AddASource \
            -only-testing:VideoPlayerUITests/ScreenshotTests/test03_Settings \
            -only-testing:VideoPlayerUITests/ScreenshotTests/test10_SortingScreens \
            -only-testing:VideoPlayerUITests/ScreenshotTests/test12_PlayerWithSampleClip

      - name: Summarise errors (file, line, message)
        if: always()
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Summarise errors (file, line, message)"
          bash scripts/ci-summarise-errors.sh "Screenshots: build and UI tests" "$OUT/test.log" "$OUT/resolve.log" "$OUT/xcodegen.log"
          python3 scripts/ci-test-report.py "$OUT/test.log" "$OUT/test-report.md" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Export the screenshots in viewing order (01-..., 02-...) with index.md
        if: always()
        timeout-minutes: 4
        run: bash scripts/ci-export-screenshots.sh "$OUT/Screenshots.xcresult" "$GITHUB_WORKSPACE/screenshots"

      # #15 item 1.2: the artifact "screenshots" must hold the MAIN set (01-79 at the top, index.md), never the accessibility
      # set. Writes screenshots/CONTENTS.txt and fails with "ARTIFACT PROBLEM: ..." otherwise; the upload runs either way.
      - name: List and check what the screenshots artifact holds (main set, 01-79)
        if: always()
        timeout-minutes: 2
        run: bash scripts/ci-artifact-contents.sh "$GITHUB_WORKSPACE/screenshots" main 2>&1 | tee "$OUT/artifact-contents.txt"; exit "${PIPESTATUS[0]}"

      - name: Stage times
        if: always()
        run: bash scripts/ci-stage.sh --summary "Screenshots, part 1"

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: ${{ github.workspace }}/screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the screenshot job logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-logs
          path: |
            build/ci/*.txt
            build/ci/*.log
            build/ci/*.md
            build/ci/attachments/
            build/ci/launch-smoke-*/
          if-no-files-found: warn
          retention-days: 14

  # JOB 4b. Screenshots, part 2 of 2: Home, Movies, Shows, the movie and show pages, Files, Search, Discover (tests 04,
  # 05). Built and checked exactly as job 4 (part 1), on its own runner with its own 30-minute cap (#21 B, split so the
  # first run is not cut off). Its artifact is "screenshots-library", in the same numbering (01-79, index.md).
  screenshots-library:
    name: Screenshots, part 2 (library and detail pages; tvOS Simulator, UI tests)
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      XCODE_APP: /Applications/Xcode_27.2.app
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
      OUT: build/ci
      # #16 item 1.8: every test run must end 1320 s after this job's first stage (scripts/ci-sim.sh, time budget), so
      # the summary, export and upload steps after it still fit in the 30-minute job cap even when the build was slow.
      CI_TEST_DEADLINE_SECONDS: "1320"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false

      - name: Prepare (select Xcode, check vendored files, install XcodeGen, generate, resolve)
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Prepare (select Xcode, check vendored files, install XcodeGen, generate, resolve)"
          bash scripts/ci-prepare.sh

      # Runtime lists, pick (runtime first: the one matching the Simulator SDK, else the newest; then the device name), then
      # the stage "Boot and retry": boot and wait; one retry, on the next runtime when this one failed to load (#21 A,
      # scripts/ci-sim.sh).
      - name: Pick the simulator (newest tvOS runtime matching the SDK first), boot and retry
        timeout-minutes: 8
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Pick the simulator (newest tvOS runtime matching the SDK first), boot and retry"
          bash scripts/ci-sim.sh prepare

      # Ad-hoc signing for this simulator build (OPEN_QUESTIONS R164, PROVISIONAL): identity "-" with no team, no profile and
      # no secret, so the entitlements in project.yml (App Group, iCloud, Keychain group) are embedded in the app. Whether the
      # simulator then APPLIES them is not stated on an Apple page: the next step prints what is embedded. If ad-hoc signing
      # fails the build, the job builds again unsigned (as before) and says so; the app must start either way (launch safety).
      - name: Build the app and the UI tests (Debug, simulator, ad-hoc signed; unsigned if that fails)
        id: build
        run: bash scripts/ci-build-uitests.sh

      - name: Show what the built app carries (signature, embedded entitlements, Info.plist scene keys)
        if: steps.build.outcome == 'success'
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Show what the built app carries (signature, embedded entitlements, Info.plist scene keys)"
          set -uo pipefail
          echo "Signing mode used: $SIGNING"
          # Apple's documented check ("Diagnosing Issues with Entitlements"): codesign --display --entitlements :- App.app
          codesign --display --verbose=2 "$APP_PATH" 2>&1 | tee "$OUT/app-signature.txt" || true
          codesign --display --entitlements :- "$APP_PATH" 2>&1 | tee "$OUT/app-entitlements.txt" || true
          plutil -p "$APP_PATH/Info.plist" | grep -A6 -E 'UIApplicationSceneManifest|UILaunchScreen|UIRequiredDeviceCapabilities' || true
          xcrun simctl help launch 2>&1 | tee "$OUT/simctl-launch-help.txt" | sed -n '1,40p' || true

      # LAUNCH SMOKE: before the UI tests, launch the app twice (no arguments, then -UITestEmpty) and check it is still running
      # after 8 s. On a crash the step prints the crash reports, the app's log and console output (scripts/ci-launch-smoke.sh)
      # and fails. "LAUNCH OK (<label>)" in the log is the proof the app stays up.
      - name: Launch smoke (plain launch and -UITestEmpty; prints the cause if the app dies)
        id: smoke
        if: steps.build.outcome == 'success'
        timeout-minutes: 4
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Launch smoke (plain launch and -UITestEmpty; prints the cause if the app dies)"
          set -uo pipefail
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          status=0
          bash scripts/ci-launch-smoke.sh "$SIM_UDID" plain 2>&1 | tee "$OUT/launch-smoke-plain.log" || status=1
          bash scripts/ci-launch-smoke.sh "$SIM_UDID" uitest-empty -UITestEmpty 2>&1 | tee "$OUT/launch-smoke-uitest-empty.log" || status=1
          {
            echo "## Launch smoke (signing: $SIGNING)"
            grep -hE '^LAUNCH (OK|FAILED)' "$OUT"/launch-smoke-*.log || echo "no result line"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status

      # The UI tests run even when the smoke step failed, so the xcresult (with its crash reports and screen recording)
      # exists for the export below. Only this part's tests run (-only-testing); the others are job 4b, 5 and 6.
      # Step cap 20 minutes: whatever the tests captured until then is still exported and uploaded.
      - name: Run the screenshot UI tests (Debug, simulator, built above)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Run the screenshot UI tests (Debug, simulator, built above)"
          set -euo pipefail
          bash scripts/ci-sim.sh test "$OUT/test.log" -- xcodebuild test-without-building \
            -project VideoPlayer.xcodeproj \
            -scheme VideoPlayerUITests \
            -configuration Debug \
            -destination "platform=tvOS Simulator,id=$SIM_UDID" \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -derivedDataPath build/DerivedData \
            -resultBundlePath "$OUT/Screenshots.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:VideoPlayerUITests/ScreenshotTests/test04_LibraryScreens \
            -only-testing:VideoPlayerUITests/ScreenshotTests/test05_FilesSearchDiscover \
            -only-testing:VideoPlayerUITests/ScreenshotTests/test13_MovieSynopsisAndCast \
            -only-testing:VideoPlayerUITests/ScreenshotTests/test14_ShowsToolbarAndCardMenu

      - name: Summarise errors (file, line, message)
        if: always()
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Summarise errors (file, line, message)"
          bash scripts/ci-summarise-errors.sh "Screenshots: build and UI tests" "$OUT/test.log" "$OUT/resolve.log" "$OUT/xcodegen.log"
          python3 scripts/ci-test-report.py "$OUT/test.log" "$OUT/test-report.md" | tee -a "$GITHUB_STEP_SUMMARY"

      # #22 D: SF Symbol names are plain strings. A wrong name does NOT fail the build or any test; it draws a blank icon.
      # So screenshot 08 (the card long-press menu: Go to Movie / Go to Show, Remove from Continue Watching, whose icon names
      # were written from memory in #21 F) must be looked at. Every symbol and the screenshot that shows it: docs/SYMBOLS.md.
      - name: Export the screenshots in viewing order (01-..., 02-...) with index.md
        if: always()
        timeout-minutes: 4
        run: bash scripts/ci-export-screenshots.sh "$OUT/Screenshots.xcresult" "$GITHUB_WORKSPACE/screenshots"

      # #15 item 1.2: the artifact "screenshots-library" holds part 2 of the MAIN set (01-79 at the top, index.md), never the
      # accessibility set. Writes screenshots/CONTENTS.txt and fails with "ARTIFACT PROBLEM: ..." otherwise; the upload runs either way.
      - name: List and check what the screenshots artifact holds (main set, 01-79)
        if: always()
        timeout-minutes: 2
        run: bash scripts/ci-artifact-contents.sh "$GITHUB_WORKSPACE/screenshots" main 2>&1 | tee "$OUT/artifact-contents.txt"; exit "${PIPESTATUS[0]}"

