          codesign --display --entitlements :- "$APP_PATH" 2>&1 | tee "$OUT/app-entitlements.txt" || true
          plutil -p "$APP_PATH/Info.plist" | grep -A6 -E 'UIApplicationSceneManifest|UILaunchScreen|UIRequiredDeviceCapabilities' || true
          xcrun simctl help launch 2>&1 | tee "$OUT/simctl-launch-help.txt" | sed -n '1,40p' || true

      # LAUNCH SMOKE: before the UI tests, launch the app twice (no arguments, then -UITestEmpty) and check it is still running
      # after 8 s. On a crash the step prints the crash reports, the app's log and console output (scripts/ci-launch-smoke.sh)
      # and fails. "LAUNCH OK (<label>)" in the log is the proof the app stays up.
      - name: Launch smoke (plain launch and -UITestEmpty; prints the cause if the app dies)
        id: smoke
        if: steps.build.outcome == 'success'
        timeout-minutes: 4
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Launch smoke (plain launch and -UITestEmpty; prints the cause if the app dies)"
          set -uo pipefail
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          status=0
          bash scripts/ci-launch-smoke.sh "$SIM_UDID" plain 2>&1 | tee "$OUT/launch-smoke-plain.log" || status=1
          bash scripts/ci-launch-smoke.sh "$SIM_UDID" uitest-empty -UITestEmpty 2>&1 | tee "$OUT/launch-smoke-uitest-empty.log" || status=1
          {
            echo "## Launch smoke (signing: $SIGNING)"
            grep -hE '^LAUNCH (OK|FAILED)' "$OUT"/launch-smoke-*.log || echo "no result line"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status

      # #24 A: one xcodebuild call per test (scripts/ci-ui-tests.sh), each with its own result bundle; after each call that
      # test's pictures are copied into the artifact folder at once (from the PNG files the test writes, else from the
      # simulator's data folder, else from a complete bundle) and index.md is written. A failed test does not stop the
      # ones after it; at the budget the running test gets SIGINT (60 s to finish), the rest are not started, and index.md
      # says "TEST STOPPED BY THE TIME BUDGET: pictures up to <name>". The step cap (35 min) is only a backstop; the next
      # step collects what a cut-off run left.
      - name: Run the UI tests, one xcodebuild call per test (pictures copied after each)
        id: uitests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 35   # R439: the 30-minute budget plus the stop grace
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Run the UI tests, one call per test"
          bash scripts/ci-ui-tests.sh "$GITHUB_WORKSPACE/screenshots" \
            test05_FilesSearchDiscover \
            test14_ShowsToolbarAndCardMenu \
            test10b_SortingScreensLargerText \
            test12b_PlayerAudioMenu \
            test12c_PlayerSubtitlesMenu

      # Runs whatever happened above: copies any picture a cut-off test step left and writes index.md again (never fails).
      - name: Collect the pictures any cut-off test left (loose PNG files)
        if: ${{ always() && steps.build.outcome == 'success' }}
        timeout-minutes: 4
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Collect the pictures any cut-off test left"
          bash scripts/ci-ui-tests.sh --collect "$GITHUB_WORKSPACE/screenshots" \
            test05_FilesSearchDiscover \
            test14_ShowsToolbarAndCardMenu \
            test10b_SortingScreensLargerText \
            test12b_PlayerAudioMenu \
            test12c_PlayerSubtitlesMenu

      - name: Summarise errors (file, line, message)
        if: always()
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Summarise errors (file, line, message)"
          bash scripts/ci-summarise-errors.sh "Screenshots: build and UI tests" "$OUT/test.log" "$OUT/resolve.log" "$OUT/xcodegen.log"
          python3 scripts/ci-test-report.py "$OUT/test.log" "$OUT/test-report.md" "UI tests and screenshots" | tee -a "$GITHUB_STEP_SUMMARY"

      # #15 item 1.2: the artifact "screenshots-more" holds part 3 of the MAIN set (01-79 at the top, index.md), never the
      # accessibility set. Writes screenshots/CONTENTS.txt and fails with "ARTIFACT PROBLEM: ..." otherwise; the upload runs either way.
      - name: List and check what the screenshots artifact holds (main set, 01-79)
        if: always()
        timeout-minutes: 2
        run: bash scripts/ci-artifact-contents.sh "$GITHUB_WORKSPACE/screenshots" main 2>&1 | tee "$OUT/artifact-contents.txt"; exit "${PIPESTATUS[0]}"

      - name: Stage times
        if: always()
        run: bash scripts/ci-stage.sh --summary "Screenshots, part 3"

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-more
          path: ${{ github.workspace }}/screenshots/
          if-no-files-found: warn
          retention-days: 14

      # R416 (run #27, item 4 a): the app's crash reports (.ips), so a crash names its line (scripts/ci-crash-reports.sh).
      - name: Copy the app's crash reports
        if: always()
        run: bash scripts/ci-crash-reports.sh "$GITHUB_WORKSPACE/build/ci"

      # R423: the crash reports alone, as a small artifact of their own (the log artifact of screenshots-library was 1.1 GB
      # in run #27); only when there is one. They stay in the log artifact too.
      - name: Upload the app's crash reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crash-reports-screenshots-more
          path: build/ci/crash-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the screenshot job logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-more-logs
          path: |
            build/ci/*.txt
            build/ci/*.log
            build/ci/*.md
            build/ci/crash-reports/
            build/ci/attachments/
            build/ci/screenshot-files/
            build/ci/ui-tests.tsv
            build/ci/launch-smoke-*/
          if-no-files-found: warn
          retention-days: 14

  # JOB 5. Accessibility screenshots, text (rule 17, docs/DESIGN_REFERENCES.md; OPEN_QUESTIONS R170; #16 item 1.10):
  # eleven screens (Home, Movies, Settings, a Files folder, two movie pages, a show page, the Backup page, Add a Source, a
  # source form, Search) under Larger Text and Bold Text, drawn by the app from launch arguments (test06; an imitation of
  # the system settings, docs/COVERAGE.md), then the same screens with no override (test11). scripts/ci-a11y-compare.py
  # then fails the job when a Larger Text or Bold Text screenshot equals its default one outside the tab bar (#17 A).
  # Its own job and its own cap, built exactly as job 4, so a slow run here never costs the main screenshots.
  # Expected time (#24 B): test06 628 s measured on fa00af8; test11 has half its screens, about 315 s (an estimate); about
  # 16 minutes, 33 planned pictures, inside the 25-minute budget. test06 and test11 stay in one job (#24 asked for test06 in
  # a job of its own): the comparison below needs both sets in one folder; each is still its own xcodebuild call.
  accessibility-screenshots:
    name: Accessibility screenshots (tvOS Simulator, UI tests)
    needs: compile   # #23 E: runs only when job 1 compiled the app; otherwise job "not-taken" says so
    runs-on: xcode-27
    timeout-minutes: 60   # #24 B: hard cap; the tests stop after 25 minutes (CI_TEST_BUDGET_SECONDS)
    env:
      XCODE_APP: /Applications/Xcode_27.2.app
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
      OUT: build/ci
      # #24 B: 25 minutes for the UI tests, counted from the start of the first one (scripts/ci-sim.sh), so a slow build
      # no longer eats the test time. Prepare, boot, build and smoke took about 12 minutes on fa00af8; 12 + 25 + the
      # collect, check and upload steps stays well inside the 60-minute job cap.
      CI_TEST_BUDGET_SECONDS: "1500"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false

      - name: Prepare (select Xcode, check vendored files, install XcodeGen, generate, resolve)
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Prepare (select Xcode, check vendored files, install XcodeGen, generate, resolve)"
          bash scripts/ci-prepare.sh

      # Runtime lists, pick (runtime first: the one matching the Simulator SDK, else the newest; then the device name), then
      # the stage "Boot and retry": boot and wait; one retry, on the next runtime when this one failed to load (#21 A,
      # scripts/ci-sim.sh).
      - name: Pick the simulator (newest tvOS runtime matching the SDK first), then boot it (stage "Boot and retry")
        timeout-minutes: 8
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Pick the simulator (newest tvOS runtime matching the SDK first)"
          bash scripts/ci-sim.sh prepare

      - name: Build the app and the UI tests (Debug, simulator, ad-hoc signed; unsigned if that fails)
        id: build
        run: bash scripts/ci-build-uitests.sh

      # #24 A: one xcodebuild call per test (scripts/ci-ui-tests.sh), each with its own result bundle; after each call that
      # test's pictures are copied into the artifact folder at once (from the PNG files the test writes, else from the
      # simulator's data folder, else from a complete bundle) and index.md is written. A failed test does not stop the
      # ones after it; at the budget the running test gets SIGINT (60 s to finish), the rest are not started, and index.md
      # says "TEST STOPPED BY THE TIME BUDGET: pictures up to <name>". The step cap (35 min) is only a backstop; the next
      # step collects what a cut-off run left.
      - name: Run the UI tests, one xcodebuild call per test (pictures copied after each)
        id: uitests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 35
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Run the UI tests, one call per test"
          bash scripts/ci-ui-tests.sh "$GITHUB_WORKSPACE/accessibility-screenshots/text" \
            test06_LargerTextAndBoldText \
            test11_AccessibilityDefaults

      # Runs whatever happened above: copies any picture a cut-off test step left and writes index.md again (never fails).
      - name: Collect the pictures any cut-off test left (loose PNG files)
        if: ${{ always() && steps.build.outcome == 'success' }}
        timeout-minutes: 4
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Collect the pictures any cut-off test left"
          bash scripts/ci-ui-tests.sh --collect "$GITHUB_WORKSPACE/accessibility-screenshots/text" \
            test06_LargerTextAndBoldText \
            test11_AccessibilityDefaults

      - name: Summarise errors (file, line, message)
        if: always()
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Summarise errors (file, line, message)"
          bash scripts/ci-summarise-errors.sh "Accessibility screenshots: build and UI tests" "$OUT/test.log" "$OUT/resolve.log" "$OUT/xcodegen.log"
          python3 scripts/ci-test-report.py "$OUT/test.log" "$OUT/test-report.md" "UI tests and screenshots" | tee -a "$GITHUB_STEP_SUMMARY"

      # #17 A: a Larger Text or Bold Text screenshot that equals the default one outside the tab bar means the override did
      # not reach the app's own text. The result is kept in the artifact (a11y-compare.txt) and fails this step.
      - name: Compare Larger Text and Bold Text with the default screens (outside the tab bar)
        if: always()
        timeout-minutes: 5
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-stage.sh" "Compare Larger Text and Bold Text with the default screens (outside the tab bar)"
          mkdir -p "$GITHUB_WORKSPACE/accessibility-screenshots"
          python3 scripts/ci-a11y-compare.py "$GITHUB_WORKSPACE/accessibility-screenshots/text" 2>&1 | tee "$GITHUB_WORKSPACE/accessibility-screenshots/a11y-compare.txt"
          status="${PIPESTATUS[0]}"
          { echo "## Larger Text and Bold Text against the default screens"; echo; sed 's/^/    /' "$GITHUB_WORKSPACE/accessibility-screenshots/a11y-compare.txt"; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # #15 item 1.2: the artifact "accessibility-screenshots" holds only 80 and above, in text/ (80-112). Writes
      # accessibility-screenshots/CONTENTS.txt and fails with "ARTIFACT PROBLEM: ..." otherwise.
      - name: List and check what the accessibility artifact holds (80 and above, text/)
        if: always()
        timeout-minutes: 2
        run: bash scripts/ci-artifact-contents.sh "$GITHUB_WORKSPACE/accessibility-screenshots" accessibility 2>&1 | tee "$OUT/artifact-contents.txt"; exit "${PIPESTATUS[0]}"

      - name: Stage times
        if: always()
        run: bash scripts/ci-stage.sh --summary "Accessibility screenshots"

      - name: Upload the accessibility screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-screenshots
          path: ${{ github.workspace }}/accessibility-screenshots/
          if-no-files-found: warn
          retention-days: 14

      # R416 (run #27, item 4 a): the app's crash reports (.ips), so a crash names its line (scripts/ci-crash-reports.sh).
      - name: Copy the app's crash reports
        if: always()
        run: bash scripts/ci-crash-reports.sh "$GITHUB_WORKSPACE/build/ci"

      # R423: the crash reports alone, as a small artifact of their own (the log artifact of screenshots-library was 1.1 GB
      # in run #27); only when there is one. They stay in the log artifact too.
      - name: Upload the app's crash reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crash-reports-accessibility-screenshots
          path: build/ci/crash-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the accessibility job logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-screenshots-logs
          path: |
            build/ci/*.txt
            build/ci/*.log
            build/ci/*.md
            build/ci/crash-reports/
            build/ci/attachments/
            build/ci/screenshot-files/
            build/ci/ui-tests.tsv
          if-no-files-found: warn
          retention-days: 14

  # #23 E. Runs only when job 1 did not succeed (the jobs with `needs: compile` are then skipped). Uploads the screenshot
  # artifacts and device-build-results under their usual names, saying "NOT TAKEN: the app did not compile" (NOT CHECKED
  # for the device inspection) with the first error line. Standard ubuntu-latest runner, no secrets, about a minute.
  not-taken:
    name: Not taken (the app did not compile)
    needs: compile
    if: ${{ !cancelled() && needs.compile.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false

      - name: Write the NOT TAKEN and NOT CHECKED notes
        env:
          COMPILE_RESULT: ${{ needs.compile.result }}
          FIRST_ERROR: ${{ needs.compile.outputs.first_error }}
        run: bash scripts/ci-not-taken.sh "$GITHUB_WORKSPACE/not-taken" "$COMPILE_RESULT" "$FIRST_ERROR"

      - name: Upload screenshots (NOT TAKEN)
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: ${{ github.workspace }}/not-taken/screenshots/
          retention-days: 14

      - name: Upload screenshots-library (NOT TAKEN)
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-library
          path: ${{ github.workspace }}/not-taken/screenshots-library/
          retention-days: 14

      - name: Upload screenshots-more (NOT TAKEN)
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-more
          path: ${{ github.workspace }}/not-taken/screenshots-more/
          retention-days: 14

      - name: Upload accessibility-screenshots (NOT TAKEN)
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-screenshots
          path: ${{ github.workspace }}/not-taken/accessibility-screenshots/
          retention-days: 14

      - name: Upload device-build-results (NOT CHECKED)
        uses: actions/upload-artifact@v7
        with:
          name: device-build-results
          path: ${{ github.workspace }}/not-taken/device-build-results/
          retention-days: 14
